default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: poetry run isort
        language: system
        types: [python]

      - id: black
        name: black
        entry: poetry run black
        language: system
        types: [python]

      - id: flake8
        name: flake8
        entry: poetry run flake8
        language: system
        types: [python]

      - id: bandit
        name: bandit
        entry: poetry run bandit -c pyproject.toml -r src
        language: system
        types: [python]
        pass_filenames: false

      - id: zuban
        name: zuban
        entry: poetry run zuban check
        language: system
        types: [python]
        pass_filenames: false
